{{ if .Site.Params.notice }}
<div class="notice sticky-top">
	<div class="container-fluid text-center">
		<p class="mb-0 p-2">
			{{ .Site.Params.notice.text | safeHTML }}
			{{ if .Site.Params.notice.link }}
			<a href="{{ .Site.Params.notice.link }}">Click here for more information.</a>
			{{ end }}
		</p>
	</div>
</div>
{{ end }}
